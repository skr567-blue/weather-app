<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Weather App</title>

    </head>

    <body>

        <h1>⛅ Weather App</h1>

        <p>Check the current weather of any city</p>

        <div class="search-section">

            <input type="text" id="cityInput" placeholder="🔍 Enter city name...">

            <button id="searchBtn">Search</button>

        </div>

        <section class="current-weather">

            <div class="location">

                <h2 id="cityName">Colombo, Sri Lanka</h2>

            </div>

            <div class="weather_icon" id="weatherIcon">☀️</div>

            <div class="temperature" id="temperature">29°C</div>

            <p id="description">Clear Sky</p>

            <p id="mainFeelsLike">
                Feels like <strong id="feelsLike">31°C</strong>
            </p>

        </section>

        <div class="weather">

            <div class="weather-card">

                <div class="weather-icon">💧</div>

                <h3>Humidity</h3>

                <strong id="humidity">78%</strong>

            </div>

            <div class="weather-card">

                <div class="weather-icon">💨</div>

                <h3>Wind</h3>

                <strong id="wind">12 km/h</strong>

            </div>

            <div class="weather-card">

                <div class="weather-icon">🌡️</div>

                <h3>Feels Like</h3>

                <strong id="feelsLikeCard">31°C</strong>

            </div>

        </div>

        <p>5 DAY FORECAST</p>

        <div class="forecast">

            <div class="forecast-card">

                <h3>Mon</h3>

                <div class="forecast-icon">☀️</div>

                <p>31°C </p>
                    
            </div>

            <div class="forecast-card">

                <h3>Tue</h3>

                <div class="forecast-icon">⛅</div>

                <p>30°C </p>
                    
            </div>

            <div class="forecast-card">

                <h3>Wed</h3>

                <div class="forecast-icon">🌧️</div>

                <p>27°C</p>
                    
            </div>

            <div class="forecast-card">

                <h3>Thu</h3>

                <div class="forecast-icon">☁️</div>

                <p>28°C </p>
                    
            </div>

            <div class="forecast-card">

                <h3>Fri</h3>

                <div class="forecast-icon">☀️</div>

                <p>31°C </p>
                    
            </div>

        </div>

        <button id="locationBtn">
            📍 Use My Location
        </button>

    </body>

</html>
