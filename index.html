<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Weather App</title>

    </head>

    <body>

        <div class="app">

            <aside class="sidebar">

                <div class="logo">
                    🌦️
                    <span>Weather</span>

                </div>

                <nav class="sidebar-nav">

                    <button>▦</button>
                    <button>🗺️</button>
                    <button>📍</button>
                    <button>◉</button>
                    <button>📅</button>
                    <button>⚙️</button>

                </nav>
            </aside>

            <main class="dashboard">

                <div class="top-grid">

                    <section class="current-weather">

                        <div class="weather-search">🔍</div>

                        <div class="weather-main">

                            <div class="weather-icon">⛈️</div>

                            <div class="temperature">28°C</div>

                            <p class="description">Rainy Storm Clouds</p>
                        </div>

                        <div class="weather-location">

                            <p>📍 Colombo, Sri Lanka</p>

                            <p>📅 25 August 2026</p>
                        </div>
                    </section>

                    <section class="highlights">

                        <h2>Today's Highlights</h2>

                        <div class="highlight-grid"> 

                            <div class="highlight-card">

                                <h3>Wind Status</h3>
                                <strong>7.90</strong>
                                <spam>km/h</spam>

                            </div>

                            
                            <div class="highlight-card">

                                <h3>Humidity</h3>
                                <strong>84%</strong>
                            </div>

                            
                            <div class="highlight-card">

                                <h3>Visibility</h3>
                                <strong>03</strong>
                                <spam>km</spam>

                            </div>

                        </div>
                    </section>

                </div>

                <div class="bottom-grid">

                    <section class="forecast-section">

                        <div class="section-header">
                            <h2>5 Day Forecast</h2>
                        </div>

                        <div class="forecast-list">

                            <div class="forecast-item">
                                <span>Mon</span>
                                <span>☀️</span>
                                <strong>29°C</strong>
                            </div>

                            <div class="forecast-item">
                                <span>Tue</span>
                                <span>⛅</span>
                                <strong>30°C</strong>
                            </div>

                            <div class="forecast-item">
                                <span>Wed</span>
                                <span>🌧️</span>
                                <strong>27°C</strong>
                            </div>

                            <div class="forecast-item">
                                <span>Thu</span>
                                <span>⛈️</span>
                                <strong>28°C</strong>
                            </div>

                            <div class="forecast-item">
                                <span>Fri</span>
                                <span>☀️</span>
                                <strong>31°C</strong>
                            </div>

                    </section>

                    <section class="map-section">

                        <h2>Weather Condition Map</h2>

                        <div class="weather-map">

                            <p>Weather Map</p>

                        </div>

                    </section>
                    
                </div>

            </main>
        </div>
        
    </body>

</html>
